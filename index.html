<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#BE000F">
<title>G&T S.R.L. — Presupuesto Digital</title>
<style>
*{box-sizing:border-box}
:root{
  --rojo:#BE000F;
  --rojo2:#98000c;
  --gris:#f3f4f6;
  --gris2:#e5e7eb;
  --texto:#222;
  --muted:#6b7280;
  --verde:#176b2c;
}
html,body{margin:0;padding:0;background:var(--gris);color:var(--texto);font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer}
header{
  background:#fff;
  border-bottom:1px solid var(--gris2);
  padding:14px 18px;
  position:sticky;top:0;z-index:20;
}
.header-inner{max-width:1050px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px}
header img{width:150px;height:auto;display:block}
.user-pill{font-size:13px;color:#555;background:#f7f7f7;border:1px solid #ddd;border-radius:20px;padding:8px 12px}
.wrap{max-width:1050px;margin:24px auto;padding:0 15px 50px}
.card{
  background:#fff;border:1px solid #e2e2e2;border-radius:14px;
  padding:20px;margin-bottom:16px;box-shadow:0 3px 14px rgba(0,0,0,.05)
}
.login-card{max-width:430px;margin:70px auto}
.logo-login{width:190px;display:block;margin:0 auto 20px}
h1{font-size:24px;margin:0 0 5px}
h2{font-size:20px;margin:0}
h3{margin:0 0 14px}
.subtitle{color:var(--muted);font-size:14px;margin-bottom:24px}
label{display:block;font-weight:700;font-size:13px;margin:0 0 6px}
input,select{
  width:100%;padding:12px;border:1px solid #cfd2d7;border-radius:9px;background:#fff;outline:none
}
input:focus,select:focus{border-color:var(--rojo);box-shadow:0 0 0 3px rgba(190,0,15,.10)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.field-full{grid-column:1/-1}
.btn{
  border:0;border-radius:9px;padding:12px 16px;font-weight:800;min-height:44px
}
.btn-primary{background:var(--rojo);color:#fff}
.btn-primary:hover{background:var(--rojo2)}
.btn-secondary{background:#fff;color:#333;border:1px solid #cfd2d7}
.btn-danger{background:#fff;color:var(--rojo);border:1px solid #e5a6ab}
.btn-large{width:100%;margin-top:16px}
.status{margin-top:14px;padding:11px;border-radius:9px;font-size:14px;display:none}
.status.error{display:block;background:#fff0f1;color:#9d0010;border:1px solid #f2b7bd}
.status.ok{display:block;background:#edf8f0;color:var(--verde);border:1px solid #b9dfc2}
.titlebar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:14px}
.add-btn{white-space:nowrap}
.empty{padding:28px;text-align:center;color:#777;border:1px dashed #ccc;border-radius:10px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:10px 8px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top;font-size:13px}
th{font-size:12px;text-transform:uppercase;color:#666;background:#fafafa}
.money{text-align:right;white-space:nowrap}
.total-box{text-align:right;margin-top:15px;font-size:22px;font-weight:800}
.total-box small{display:block;font-size:12px;color:#777;font-weight:400;margin-bottom:3px}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;
  display:none;align-items:center;justify-content:center;padding:15px
}
.modal-backdrop.open{display:flex}
.modal{
  width:min(560px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:15px;padding:20px;
  box-shadow:0 15px 50px rgba(0,0,0,.3)
}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.close{border:0;background:#eee;border-radius:50%;width:34px;height:34px}
#reader{width:100%;max-width:430px;margin:15px auto}
.scan-note{font-size:13px;color:#666;text-align:center}
.product-info{background:#f7f7f7;border-radius:10px;padding:14px;margin-bottom:15px;line-height:1.55}
.calc-info{margin-top:10px;color:#555;font-size:13px;line-height:1.5}
.checkbox{display:flex;align-items:center;gap:8px;margin:13px 0;font-weight:700}
.checkbox input{width:auto}
.loading{text-align:center;padding:35px;color:#666}
.quote-preview{
  background:#fff;
  width:100%;
  max-width:none;
  margin:0 auto;
  padding:8mm;
  box-sizing:border-box;
  color:#183746;
  font-family:Arial,Helvetica,sans-serif;
}
.quote-head{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0;
  min-height:48mm;
  padding:4mm 2mm 4mm;
  border-bottom:2px solid #BE000F;
  box-sizing:border-box;
}
.quote-company{padding-right:7mm}
.quote-logo{width:62mm;max-width:100%;height:auto;display:block;margin-bottom:2mm}
.quote-company-data{font-size:3.2mm;line-height:1.5;color:#183746}
.quote-company-data strong{font-weight:800}
.quote-presentation{
  border-left:2px solid #BE000F;
  padding-left:8mm;
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  justify-content:center;
  text-align:right;
}
.quote-title{
  font-size:11mm;
  line-height:1;
  font-weight:900;
  letter-spacing:.2mm;
  color:#183746;
  white-space:nowrap;
}
.quote-number{
  margin-top:3mm;
  font-size:6.2mm;
  line-height:1.1;
  font-weight:900;
  color:#BE000F;
  white-space:nowrap;
}
.quote-meta{
  margin-top:4mm;
  color:#183746;
  font-size:3.4mm;
  line-height:1.65;
  text-align:right;
}
.quote-meta strong{font-weight:800}
.quote-section{margin-top:3mm}
.quote-section-line{height:2px;background:#BE000F;margin-bottom:3mm}
.quote-section-title{
  display:flex;
  align-items:center;
  gap:3mm;
  margin-bottom:2.5mm;
  font-size:4mm;
  font-weight:900;
  text-transform:uppercase;
  color:#183746;
}
.quote-section-title::before{
  content:"";
  width:4mm;
  height:4mm;
  border-radius:1mm;
  background:#C58A22;
  flex:0 0 auto;
}
.quote-customer{
  margin:0;
  padding:3mm 2mm;
  background:#fff;
  border:0;
  border-radius:0;
  font-size:3.4mm;
  line-height:1.8;
  color:#263f4b;
}
.quote-customer-grid{
  display:grid;
  grid-template-columns:1.6fr 1fr;
  column-gap:8mm;
  row-gap:1mm;
}
.quote-field{min-width:0}
.quote-field strong{color:#183746;font-weight:800}
.quote-field-value{color:#333}
.quote-payment{
  margin-top:2mm;
  padding:3mm 2mm;
  display:flex;
  align-items:center;
  gap:5mm;
  border-top:1px solid #d9dee1;
  border-bottom:1px solid #d9dee1;
  font-size:3.3mm;
}
.quote-payment-title{font-weight:900;color:#183746;margin-right:2mm}
.quote-payment-option{display:inline-flex;align-items:center;gap:2mm;color:#344954}
.quote-check{width:4mm;height:4mm;border:1.3px solid #183746;border-radius:.8mm;display:inline-block;box-sizing:border-box}
.quote-payment-selected{display:none}
.quote-detail{margin-top:3mm}
.quote-table{width:100%;min-width:0;border-collapse:collapse;table-layout:fixed}
.quote-table th{background:#183746;color:#fff;padding:3mm 2mm;border:1px solid #183746;font-size:3.1mm;font-weight:800;text-transform:uppercase}
.quote-table td{padding:2.5mm 2mm;border:1px solid #d7dde0;font-size:3.1mm;color:#263f4b;vertical-align:middle}
.quote-table tbody tr:nth-child(even){background:#f4f6f7}
.quote-table th:nth-child(1),.quote-table td:nth-child(1){width:31%}
.quote-table th:nth-child(2),.quote-table td:nth-child(2){width:12%}
.quote-table th:nth-child(3),.quote-table td:nth-child(3){width:11%;text-align:center}
.quote-table th:nth-child(4),.quote-table td:nth-child(4){width:10%;text-align:center}
.quote-table th:nth-child(5),.quote-table td:nth-child(5){width:16%;text-align:right}
.quote-table th:nth-child(6),.quote-table td:nth-child(6){width:20%;text-align:right}
.quote-table small{color:#6b7280;font-size:2.8mm}
.quote-medida-unidades{display:block;margin-top:.8mm;color:#6b7280;font-size:2.5mm;line-height:1.1;white-space:nowrap}
.money{text-align:right;white-space:nowrap}
.quote-total{display:flex;justify-content:flex-end;align-items:center;gap:5mm;margin-top:4mm;font-size:5mm;font-weight:900;color:#183746}
.quote-total-value{min-width:45mm;padding:3mm 4mm;text-align:right;border:2px solid #183746;border-radius:2mm;background:#f2f5f6;color:#BE000F}
.quote-footer-line{height:2px;background:#BE000F;margin-top:5mm;margin-bottom:3mm}
.quote-foot{margin:0;padding:0;border:0;font-size:3mm;line-height:1.5;color:#59666c;display:grid;grid-template-columns:1fr 1.5fr;gap:8mm;align-items:center}
.quote-thanks{font-size:4mm;font-weight:800;color:#183746}
.quote-thanks span{color:#C58A22}
.quote-legal{text-align:right}
.quote-legal strong{color:#183746}
.historical-actions{display:flex;gap:10px;margin-bottom:15px}
.badge{display:inline-block;font-size:11px;padding:4px 7px;border-radius:10px;background:#eee;color:#555}.badge-zocalo{background:#e5e7eb;color:#555}
@media(max-width:800px){
  .grid{grid-template-columns:1fr 1fr}
}
@media(max-width:560px){
  header{position:relative}
  .header-inner{align-items:flex-start}
  header img{width:125px}
  .user-pill{font-size:11px}
  .wrap{margin:12px auto}
  .card{padding:15px;border-radius:11px}
  .grid{grid-template-columns:1fr}
  .titlebar{align-items:stretch;flex-direction:column}
  .add-btn{width:100%}
  .actions{flex-direction:column}
  .actions button{width:100%}
  .quote-head{flex-direction:column}
  .quote-number,.quote-meta{text-align:left}
}
@media print{
  @page{size:A4;margin:0}
  html,body{width:210mm;min-height:297mm;margin:0;padding:0;background:#fff}
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  header,.no-print{display:none!important}
  .wrap{width:210mm;max-width:none;margin:0;padding:0}
  .card{border:0;box-shadow:none;padding:0;margin:0}
  .quote-preview{width:210mm;min-height:297mm;margin:0;padding:8mm;box-sizing:border-box;border:0}
  .quote-head,.quote-customer,.quote-payment,.quote-detail,.quote-total,.quote-foot{page-break-inside:avoid}
  .quote-table{page-break-inside:auto}
  .quote-table tr{page-break-inside:avoid;page-break-after:auto}
}
</style>

<body>

<div id="app"></div>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycby_3DebaIbZZW2qZ7ShkePBD40Bzo8wGyaHAw8w0omsKahF6CpuUEEPaG2ox3fGkAqk0w/exec";
const LOGO_URL = "https://raw.githubusercontent.com/Jdequelli85/qr-corralon/main/logo.png";

let token = sessionStorage.getItem("gt_token") || "";
let vendedor = sessionStorage.getItem("gt_usuario") || "";
let productos = [];
let productoActual = null;
let scanner = null;
let scanProcesando = false;
let verNumero = new URLSearchParams(location.search).get("ver") || "";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const fmt = n => Number(n || 0).toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0 = n => Number(n || 0).toLocaleString("es-AR",{maximumFractionDigits:0});

function categoriaProducto(p){
  const id=String(p?.["ID"]||"").trim().toUpperCase();
  if(id.startsWith("CRRL-")) return "CRRL";
  if(id.startsWith("CER-")) return "CER";
  if(id.startsWith("POR-")) return "POR";
  if(id.startsWith("REV-")) return "REV";
  if(id.startsWith("PSO-")) return "PSO";
  return "OTRO";
}

function esMaterialCorralon(p){ return categoriaProducto(p)==="CRRL"; }

function sonidoQR(){
  try{
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if(!AudioCtx)return;
    const ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "sine";
    osc.frequency.value = 880;

    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.16, ctx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.13);

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();
    osc.stop(ctx.currentTime + 0.14);
    osc.onended = () => ctx.close();
  }catch(e){}
}

function nuevoPresupuesto(){
  productos = [];
  productoActual = null;
  verNumero = "";
  renderApp();
}

function jsonp(params){
  return new Promise((resolve,reject)=>{
    const callback = "gtcb_" + Date.now() + "_" + Math.floor(Math.random()*100000);
    const script = document.createElement("script");
    const q = new URLSearchParams({...params,callback,_ts:Date.now()});
    let timer = setTimeout(()=>{cleanup();reject(new Error("Tiempo de espera agotado."));},20000);
    function cleanup(){clearTimeout(timer);delete window[callback];script.remove();}
    window[callback] = data => {cleanup();resolve(data)};
    script.onerror = ()=>{cleanup();reject(new Error("No se pudo conectar con el servidor."))};
    script.src = API_URL + "?" + q.toString();
    document.body.appendChild(script);
  });
}

function mostrarLogin(mensaje=""){
  document.title="G&T S.R.L. — Presupuesto Digital";
  $("app").innerHTML = `
    <main class="wrap">
      <section class="card login-card">
        <img class="logo-login" src="${LOGO_URL}" alt="G&T S.R.L.">
        <h1>Presupuesto Digital</h1>
        <div class="subtitle">Acceso para personal autorizado</div>
        <form id="loginForm">
          <label>Vendedor</label>
          <select id="loginUsuario" required>
            <option value="">Seleccioná tu nombre</option>
            <option value="Agustin">Agustin</option>
            <option value="Gaston">Gaston</option>
            <option value="Tomito">Tomito</option>
            <option value="Julio">Julio</option>
          </select>
          <div style="height:12px"></div>
          <label>PIN</label>
          <input id="loginPin" type="password" inputmode="numeric" autocomplete="off" required>
          <button class="btn btn-primary btn-large" id="loginBtn">INGRESAR</button>
          <div id="loginStatus" class="status ${mensaje?'error':''}">${esc(mensaje)}</div>
        </form>
        <div style="margin-top:22px;text-align:center;color:#888;font-size:12px">G&T S.R.L. · Presupuesto Digital</div>
      </section>
    </main>`;
  $("loginForm").onsubmit=async e=>{
    e.preventDefault();
    const btn=$("loginBtn"), st=$("loginStatus");
    btn.disabled=true; btn.textContent="VERIFICANDO...";
    st.className="status"; st.textContent="";
    try{
      const r=await jsonp({accion:"login",usuario:$("loginUsuario").value,pin:$("loginPin").value});
      if(!r || !r.ok) throw new Error(r?.error || "Usuario o PIN incorrecto.");
      token=r.token; vendedor=r.usuario;
      sessionStorage.setItem("gt_token",token);
      sessionStorage.setItem("gt_usuario",vendedor);
      renderApp();
    }catch(err){
      st.className="status error"; st.textContent=err.message;
      btn.disabled=false; btn.textContent="INGRESAR";
    }
  };
}

function header(){
  return `<header><div class="header-inner">
    <img src="${LOGO_URL}" alt="G&T S.R.L.">
    <div class="user-pill">Vendedor: <strong>${esc(vendedor)}</strong></div>
  </div></header>`;
}

function renderApp(){
  if(!token){mostrarLogin();return;}
  if(verNumero){renderLoadingHistorico();cargarHistorico(verNumero);return;}
  document.title="G&T S.R.L. — Presupuesto Digital";
  $("app").innerHTML = header()+`
  <main class="wrap">
    <section class="card">
      <h1>Presupuesto Digital</h1>
      <div class="subtitle">Nuevo presupuesto · el número se asigna al guardar</div>
      <div class="grid">
        <div><label>Cliente *</label><input id="cliente" placeholder="Nombre y apellido / Razón social"></div>
        <div><label>DNI / CUIT</label><input id="dni"></div>
        <div><label>Teléfono</label><input id="telefono"></div>
        <div><label>Email</label><input id="email" type="email"></div>
        <div><label>Dirección</label><input id="direccion"></div>
        <div><label>Forma de pago</label>
          <select id="forma"><option value="Contado">Contado</option><option value="Tarjeta">Tarjeta</option><option value="Otro">Otro</option></select>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="titlebar">
        <h2>Productos</h2>
        <button class="btn btn-primary add-btn" id="add">＋ AGREGAR PRODUCTO</button>
      </div>
      <div id="empty" class="empty">Todavía no se agregaron productos.</div>
<div class="table-wrap"><table id="table" hidden>
  <thead>
    <tr>
      <th>Producto</th>
      <th>Medida</th>
      <th>Cantidad</th>
      <th>Cajas</th>
      <th>P. UNIT.</th>
      <th>Subtotal</th>
      <th></th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table></div>
      <div class="total-box"><small>Total presupuesto</small>$ <span id="total">0,00</span></div>
      <div class="actions">
        <button class="btn btn-secondary" id="cancel">CANCELAR</button>
        <button class="btn btn-primary" id="generate">GENERAR PRESUPUESTO</button>
      </div>
      <div id="appStatus" class="status"></div>
    </section>
  </main>

  <div class="modal-backdrop" id="modal">
    <div class="modal">
      <div class="modal-head"><h3>Agregar producto</h3><button class="close" id="close">×</button></div>
      <div id="scanArea">
        <p class="scan-note">Escaneá el QR del producto con la cámara.</p>
        <div id="reader"></div>
        <div id="scanError" class="status"></div>
      </div>
      <div id="calcArea" hidden>
        <div id="productInfo" class="product-info"></div>
        <div id="m2Area">
          <label>Metros cuadrados necesarios *</label>
          <input id="m2" type="number" min="0.01" step="0.01" placeholder="Ej.: 28">
          <label class="checkbox"><input id="zocalo" type="checkbox"> Con zócalo (+10%)</label>
        </div>
        <div id="cantidadArea" hidden>
          <label>Cantidad *</label>
          <input id="cantidad" type="number" min="1" step="1" placeholder="Ej.: 10">
        </div>
        <div id="calcInfo" class="calc-info"></div>
        <button class="btn btn-primary btn-large" id="confirm">AGREGAR AL PRESUPUESTO</button>
      </div>
    </div>
  </div>`;
  $("add").onclick=abrirModal;
  $("close").onclick=cerrarModal;
  $("cancel").onclick=()=>{if(confirm("¿Cancelar este presupuesto?")){productos=[];limpiarFormulario();renderProductos()}};
  $("generate").onclick=guardarPresupuesto;
  $("m2").oninput=calcularActual;
  $("zocalo").onchange=calcularActual;
  $("cantidad").oninput=calcularActual;
  renderProductos();
}

function limpiarFormulario(){
  ["cliente","dni","telefono","email","direccion"].forEach(id=>{if($(id))$(id).value=""});
  if($("forma"))$("forma").value="Contado";
}

async function abrirModal(){
  scanProcesando = false;
  $("modal").classList.add("open");
  $("scanArea").hidden=false;$("calcArea").hidden=true;
  $("scanError").className="status";$("scanError").textContent="";
  try{
    scanner = new Html5Qrcode("reader");
    await scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:250,height:250}},onScan);
  }catch(e){
    $("scanError").className="status error";
    $("scanError").textContent="No se pudo abrir la cámara. Verificá el permiso del navegador.";
  }
}

async function cerrarModal(){
  scanProcesando = false;
  if(scanner){
    try{await scanner.stop();}catch(e){}
    try{scanner.clear();}catch(e){}
    scanner=null;
  }
  $("modal")?.classList.remove("open");
}

async function onScan(text){
  if(scanProcesando)return;

  const id=extraerId(text);
  if(!id)return;

  scanProcesando = true;

  if(scanner){try{await scanner.stop();}catch(e){}}
  $("scanArea").hidden=true;

  try{
    const r=await jsonp({accion:"producto",id});
    if(!r?.ok)throw new Error(r?.error||"Producto no encontrado.");

    sonidoQR();

    productoActual=r.producto;
    mostrarProducto();
  }catch(e){
    $("scanArea").hidden=false;
    $("scanError").className="status error";
    $("scanError").textContent=e.message;
    scanProcesando = false;
    setTimeout(()=>abrirModal(),300);
  }
}

function extraerId(text){
  const t=String(text||"").trim();
  const m=t.match(/[?&]id=([^&]+)/i);
  return m?decodeURIComponent(m[1]):t;
}

function mostrarProducto(){
  const p=productoActual;
  const crrl=esMaterialCorralon(p);

  const oferta=Number(p["OFERTA"]||0);
  const tieneOferta=Number.isFinite(oferta)&&oferta>0;

  const precioContado=Number(p["Precio Contado"]||0);
  const precioTarjeta=Number(p["Precio Tarjeta"]||0);
  const forma=$("forma")?.value||"Contado";

  const precio=
    forma==="Tarjeta"&&precioTarjeta>0
      ? precioTarjeta
      : (tieneOferta?oferta:precioContado);

  /* =========================
     MATERIAL DE CORRALÓN
     ========================= */
  if(crrl){
    $("productInfo").innerHTML=`
      <strong>${esc(p["Producto"])}</strong><br>
      <strong>${tieneOferta?"🔥 OFERTA":"Precio"}: $ ${fmt(precio)} /unidad</strong>`;

    $("m2Area").hidden=true;
    $("cantidadArea").hidden=false;

    $("cantidad").value="";
    $("calcInfo").textContent="";
    $("calcArea").hidden=false;

    $("cantidad").focus();
    return;
  }

  /* =========================
     CERÁMICOS / PORCELANATOS /
     REVESTIMIENTOS / PISOS
     ========================= */

  const coloresRaw=String(p["Color"]||"").trim();

  const colores=coloresRaw
    .split(/\s*-\s*/)
    .map(c=>c.trim())
    .filter(Boolean);

  let selectorColor="";

  if(colores.length>1){
    selectorColor=`
      <br>
      <label>Color *</label>
      <select id="colorSelect">
        <option value="">Seleccioná un color</option>
        ${colores.map(c=>`
          <option value="${esc(c)}">${esc(c)}</option>
        `).join("")}
      </select>
    `;
  }

  $("productInfo").innerHTML=`
    <strong>${esc(p["Producto"])}</strong><br>
    ${esc(p["Medida"]||"")}
    ${selectorColor}
    <br>
    <strong>${tieneOferta?"🔥 OFERTA":"Precio"}: $ ${fmt(precio)} /m²</strong><br>
    Caja: ${fmt(p["Caja m²"])} m² · ${fmt0(p["Kg/Caja"]||0)} kg/caja`;

  $("m2Area").hidden=false;
  $("cantidadArea").hidden=true;

  $("m2").value="";
  $("zocalo").checked=false;
  $("calcInfo").textContent="";
  $("calcArea").hidden=false;

  if(colores.length===1){
    productoActual._colorSeleccionado=colores[0];
  }else{
    productoActual._colorSeleccionado="";
  }

  $("colorSelect")?.addEventListener("change",function(){
    productoActual._colorSeleccionado=this.value;
  });

  $("m2").focus();
  calcularActual();
}
  
function calcularActual(){
  if(!productoActual)return null;
  const crrl=esMaterialCorralon(productoActual);
  const oferta=Number(productoActual["OFERTA"]||0);
  const tieneOferta=Number.isFinite(oferta)&&oferta>0;
  const forma=$("forma").value||"Contado";
  const precioTarjeta=Number(productoActual["Precio Tarjeta"]||0);
  const precio=(forma==="Tarjeta"&&precioTarjeta>0)?precioTarjeta:(tieneOferta?oferta:Number(productoActual["Precio Contado"]||0));

  if(crrl){
    const cantidad=Number($("cantidad")?.value||0);
    if(cantidad<=0){$("calcInfo").textContent="";return null}
    const subtotal=cantidad*precio;
    $("calcInfo").textContent=`${cantidad} unidades · Subtotal: $ ${fmt(subtotal)}`;
    return {unidad:"Unidades",cantidad, m2Solicitados:0,conZocalo:false,porcentajeAdicional:0,m2Calculados:0,cajas:0,m2Reales:0,precioM2:precio,precioCaja:precio,subtotal,tieneOferta,oferta};
  }

  const m2=Number($("m2").value||0);if(m2<=0){$("calcInfo").textContent="";return null}
  const conZ=$("zocalo").checked, extra=conZ?10:0, m2Calc=m2*(1+extra/100);
  const caja=Number(productoActual["Caja m²"]||0);
  const cajas=Math.ceil(m2Calc/caja), reales=cajas*caja;
  const subtotal=reales*precio;
  $("calcInfo").textContent=`${conZ?"Con zócalo (+10%) · ":""}${cajas} cajas · ${fmt(reales)} m² reales · Subtotal: $ ${fmt(subtotal)}`;
  return {unidad:"m²",cantidad:m2,m2Solicitados:m2,conZocalo:conZ,porcentajeAdicional:extra,m2Calculados:m2Calc,cajas,m2Reales:reales,precioM2:precio,precioCaja:precio*caja,subtotal,tieneOferta,oferta};
}

function renderProductos(){
  if(!$("rows"))return;

  $("rows").innerHTML="";
  let total=0;

  productos.forEach((p,i)=>{
    total+=Number(p.subtotal||0);

    const esCRRL = String(p.id||"").toUpperCase().startsWith("CRRL-");

    let cantidadHTML="";

    if(esCRRL){

      cantidadHTML=`
        <strong>${fmt0(p.cantidad||0)} unidades</strong>
      `;

    }else{

      const m2Solicitados=Number(p.m2Solicitados||0);
      const m2Calculados=Number(p.m2Reales||0);
      const m2Zocalo=p.conZocalo
        ? Math.max(0,m2Calculados-m2Solicitados)
        : 0;

      cantidadHTML=`
        <strong>${fmt(m2Solicitados)} m²</strong>
        ${p.conZocalo && m2Zocalo>0
          ? `<br><small>+ ${fmt(m2Zocalo)} m² zócalo</small>`
          : ""
        }
      `;
    }

    const precioUnitario=Number(p.precioM2||0);

    const tr=document.createElement("tr");

    tr.innerHTML=`
      <td>
        <strong>${esc(p.producto)}</strong>
        ${p.color ? `<br><small>${esc(p.color)}</small>` : ""}
        ${p.tieneOferta ? ' <span class="badge">OFERTA</span>' : ""}
        ${p.conZocalo
          ? ' <span class="badge">INCLUIDO ZÓCALO</span>'
          : ""
        }
      </td>

      <td>${esc(p.medida||"—")}</td>

      <td>${cantidadHTML}</td>

      <td>${esCRRL ? "—" : p.cajas}</td>

      <td class="money">$ ${fmt(precioUnitario)}</td>

      <td class="money">$ ${fmt(p.subtotal)}</td>

      <td>
        <button class="btn btn-danger" data-remove="${i}" title="Eliminar">🗑</button>
      </td>
    `;

    $("rows").appendChild(tr);
  });

  $("total").textContent=fmt(total);
  $("empty").hidden=productos.length>0;
  $("table").hidden=productos.length===0;
}
  
$("cantidad")?.addEventListener("input",calcularActual);

const colorSeleccionado = $("colorSelect")?.value || p._colorSeleccionado || p["Color"] || "";

productos.push({

async function guardarPresupuesto(){
  if(!productos.length)return alert("Agregá al menos un producto.");
  const cliente=$("cliente").value.trim();
  if(!cliente)return alert("Ingresá el cliente.");
  const total=productos.reduce((s,p)=>s+Number(p.subtotal||0),0);
  const datos={
    cliente,dniCuit:$("dni").value.trim(),telefono:$("telefono").value.trim(),
    email:$("email").value.trim(),direccion:$("direccion").value.trim(),
    formaPago:$("forma").value,subtotal:total,descuento:0,total,
    observaciones:"",productos
  };
  const btn=$("generate"),st=$("appStatus");
  btn.disabled=true;btn.textContent="GUARDANDO...";
  st.className="status";st.textContent="";
  try{
    const r=await jsonp({accion:"guardar",token,datos:JSON.stringify(datos)});

function unidadesPorCaja(p){
  if(!p || String(p.unidad||"")==="Unidades") return 0;

  const medida=String(p.medida||"").trim();
  let cajaM2=Number(p.cajaM2||0);

  if((!Number.isFinite(cajaM2) || cajaM2<=0) && Number(p.m2Reales||0)>0 && Number(p.cajas||0)>0){
    cajaM2=Number(p.m2Reales)/Number(p.cajas);
  }

  if(!medida || !Number.isFinite(cajaM2) || cajaM2<=0) return 0;

  // Acepta medidas como:
  // 42,5x42,5 | 60X60 | 120X60 | 57,5x117
  const m=medida
    .replace(/\s/g,"")
    .replace(/,/g,".")
    .toLowerCase()
    .match(/^(\d+(?:\.\d+)?)x(\d+(?:\.\d+)?)$/);

  if(!m) return 0;

  const anchoCm=Number(m[1]);
  const altoCm=Number(m[2]);

  if(!anchoCm || !altoCm) return 0;

  const superficiePieza=(anchoCm/100)*(altoCm/100);
  if(!superficiePieza) return 0;

  // La caja puede estar expresada con redondeo a 2 decimales.
  // Redondeamos la cantidad de piezas al entero físico más cercano.
  const unidades=Math.round(cajaM2/superficiePieza);

  return unidades>0 ? unidades : 0;
}
