<script>
const API_URL = "https://script.google.com/macros/s/AKfycby_3DebaIbZZW2qZ7ShkePBD40Bzo8wGyaHAw8w0omsKahF6CpuUEEPaG2ox3fGkAqk0w/exec";
const LOGO_URL = "https://raw.githubusercontent.com/Jdequelli85/qr-corralon/main/logo.png";

let token = sessionStorage.getItem("gt_token") || "";
let vendedor = sessionStorage.getItem("gt_usuario") || "";
let productos = [];
let catalogoProductos = [];
let catalogoOpciones = [];
let productoActual = null;
let verNumero = new URLSearchParams(location.search).get("ver") || "";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const fmt = n => Number(n || 0).toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0 = n => Number(n || 0).toLocaleString("es-AR",{maximumFractionDigits:0});

function categoriaProducto(p){
  const id=String(p?.["ID"]||"").trim().toUpperCase();
  if(id.startsWith("CRRL-")) return "CRRL";
  if(id.startsWith("CER-")) return "CER";
  if(id.startsWith("POR-")) return "POR";
  if(id.startsWith("REV-")) return "REV";
  if(id.startsWith("PSO-")) return "PSO";
  return "OTRO";
}

function esMaterialCorralon(p){ return categoriaProducto(p)==="CRRL"; }

function sonidoQR(){
  try{
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if(!AudioCtx)return;
    const ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "sine";
    osc.frequency.value = 880;

    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.16, ctx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.13);

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();
    osc.stop(ctx.currentTime + 0.14);
    osc.onended = () => ctx.close();
  }catch(e){}
}

function nuevoPresupuesto(){
  productos = [];
  productoActual = null;
  verNumero = "";
  renderApp();
}

function jsonp(params){
  return new Promise((resolve,reject)=>{
    const callback = "gtcb_" + Date.now() + "_" + Math.floor(Math.random()*100000);
    const script = document.createElement("script");
    const q = new URLSearchParams({...params,callback,_ts:Date.now()});
    let timer = setTimeout(()=>{cleanup();reject(new Error("Tiempo de espera agotado."));},20000);
    function cleanup(){clearTimeout(timer);delete window[callback];script.remove();}
    window[callback] = data => {cleanup();resolve(data)};
    script.onerror = ()=>{cleanup();reject(new Error("No se pudo conectar con el servidor."))};
    script.src = API_URL + "?" + q.toString();
    document.body.appendChild(script);
  });
}

async function cargarCatalogo(){
  const r = await jsonp({accion:"catalogo",token});

  if(!r?.ok) {
    throw new Error(r?.error || "No se pudo cargar el catálogo de productos.");
  }

  catalogoProductos = Array.isArray(r.productos)
    ? r.productos
    : (Array.isArray(r.catalogo) ? r.catalogo : []);

  catalogoOpciones = [];

  /*
   * CATÁLOGO PC
   * -------------------------
   * Una sola opción por:
   * PRODUCTO + MEDIDA
   *
   * Los colores NO se duplican.
   * Se seleccionan posteriormente
   * en la ventana de configuración.
   */

  const claves = new Set();

  catalogoProductos.forEach(p => {

    const categoria = categoriaProducto(p);

    if(categoria === "OTRO") return;

    const producto = String(p["Producto"] || "").trim();
    const medida = String(p["Medida"] || "").trim();

    /*
     * CRRL:
     * No tiene color ni medida como
     * característica del producto.
     */
    if(categoria === "CRRL"){
      const clave = `CRRL|${producto.toUpperCase()}`;

      if(claves.has(clave)) return;

      claves.add(clave);

      catalogoOpciones.push({
        ...p,
        _colorSeleccionado: ""
      });

      return;
    }

    /*
     * CER / POR / REV / PSO
     *
     * Una sola opción por Producto + Medida.
     */
    const clave =
      `${categoria}|${producto.toUpperCase()}|${medida.toUpperCase()}`;

    if(claves.has(clave)) return;

    claves.add(clave);

    catalogoOpciones.push({
      ...p,
      _colorSeleccionado: ""
    });
  });

  if(!catalogoOpciones.length) {
    throw new Error("El catálogo no contiene productos disponibles.");
  }
}

  if(!token){mostrarLogin();return;}
  if(verNumero){renderLoadingHistorico();cargarHistorico(verNumero);return;}
  if(!catalogoOpciones.length){

        </div>
      </div>
    </section>

    <section class="card">
      <div class="titlebar">
        <h2>Productos</h2>
        <button class="btn btn-primary add-btn" id="add">＋ AGREGAR PRODUCTO</button>
      </div>
      <div id="empty" class="empty">Todavía no se agregaron productos.</div>
<div class="table-wrap"><table id="table" hidden>
  <thead>
    <tr>

      <th>Cajas</th>

    </tr>

  <tbody id="rows"></tbody>
</table></div>
      <div class="total-box"><small>Total presupuesto</small>$ <span id="total">0,00</span></div>

        <button class="btn btn-secondary" id="cancel">CANCELAR</button>

function limpiarFormulario(){
  ["cliente","dni","telefono","email","direccion"].forEach(id=>{if($(id))$(id).value=""});
  if($("forma"))$("forma").value="Contado";
}

function abrirModal(){
  productoActual = null;
  $("modal").classList.add("open");
  $("catalogArea").hidden=false;
  $("calcArea").hidden=true;
  $("catalogoError").className="status";
  $("catalogoError").textContent="";
  $("buscarProducto").value="";
  renderCatalogo();
  setTimeout(()=>$("buscarProducto")?.focus(),50);
}

function cerrarModal(){
  $("modal")?.classList.remove("open");
  productoActual=null;
}

function textoOpcionCatalogo(p){
  const producto=String(p["Producto"]||"").trim();
  const color=String(p._colorSeleccionado||"").trim();
  const medida=String(p["Medida"]||"").trim();
  if(categoriaProducto(p)==="CRRL") return producto;
function textoOpcionCatalogo(p){
  const producto = String(p["Producto"] || "").trim();
  const medida = String(p["Medida"] || "").trim();

  if(categoriaProducto(p) === "CRRL") {
    return producto;
  }

  return medida
    ? `${producto} (${medida})`
    : producto;
}
}

function renderCatalogo(){
  const lista=$("catalogoLista");
  if(!lista)return;
  const q=String($("buscarProducto")?.value||"").trim().toLocaleLowerCase("es-AR");
  const resultados=catalogoOpciones.filter(p=>{
    if(!q)return true;
    return textoOpcionCatalogo(p).toLocaleLowerCase("es-AR").includes(q);
  });

  if(!resultados.length){
    lista.innerHTML='<div class="empty">No se encontraron productos.</div>';
    return;
  }

  lista.innerHTML=resultados.map((p,i)=>`
    <button type="button" class="catalogo-item" data-catalogo-index="${catalogoOpciones.indexOf(p)}">
      <strong>${esc(p["Producto"]||"")}</strong>
      <span>${esc(p["Medida"] || "")}</span>
    </button>`).join("");
}

function seleccionarProductoCatalogo(indice){
  const p=catalogoOpciones[indice];
  if(!p)return;
  productoActual={...p};
  $("catalogArea").hidden=true;
  $("calcArea").hidden=false;
  mostrarProducto();
}

function mostrarProducto(){
  const p=productoActual;
  const crrl=esMaterialCorralon(p);

  const oferta=Number(p["OFERTA"]||0);
  const tieneOferta=Number.isFinite(oferta)&&oferta>0;

  const precioContado=Number(p["Precio Contado"]||0);
  const precioTarjeta=Number(p["Precio Tarjeta"]||0);
  const forma=$("forma")?.value||"Contado";

  const precio=
    forma==="Tarjeta"&&precioTarjeta>0
      ? precioTarjeta
      : (tieneOferta?oferta:precioContado);

  /* =========================
     MATERIAL DE CORRALÓN
     ========================= */
  if(crrl){
    $("productInfo").innerHTML=`
      <strong>${esc(p["Producto"])}</strong><br>
      <strong>${tieneOferta?"🔥 OFERTA":"Precio"}: $ ${fmt(precio)} /unidad</strong>`;

    $("m2Area").hidden=true;
    $("cantidadArea").hidden=false;

    $("cantidad").value="";
    $("calcInfo").textContent="";
    $("calcArea").hidden=false;

    $("cantidad").focus();
    return;
  }

  /* =========================
     CERÁMICOS / PORCELANATOS /
     REVESTIMIENTOS / PISOS
     ========================= */

  const coloresRaw=String(p["Color"]||"").trim();

  const colores=coloresRaw
    .split(/\s*-\s*/)
    .map(c=>c.trim())
    .filter(Boolean);

  let selectorColor="";

  if(colores.length>1){
    selectorColor=`
      <br>
      <label>Color *</label>
      <select id="colorSelect">
        <option value="">Seleccioná un color</option>
        ${colores.map(c=>`
          <option value="${esc(c)}">${esc(c)}</option>
        `).join("")}
      </select>
    `;
  }

  $("productInfo").innerHTML=`
    <strong>${esc(p["Producto"])}</strong><br>
    ${esc(p["Medida"]||"")}
    ${selectorColor}
    <br>
    <strong>${tieneOferta?"🔥 OFERTA":"Precio"}: $ ${fmt(precio)} /m²</strong><br>
    Caja: ${fmt(p["Caja m²"])} m² · ${fmt0(p["Kg/Caja"]||0)} kg/caja`;

  $("m2Area").hidden=false;
  $("cantidadArea").hidden=true;

  $("m2").value="";
  $("zocalo").checked=false;
  $("calcInfo").textContent="";
  $("calcArea").hidden=false;

  if(colores.length===1){
    productoActual._colorSeleccionado=colores[0];
  }else{
    productoActual._colorSeleccionado="";
  }

  $("colorSelect")?.addEventListener("change",function(){
    productoActual._colorSeleccionado=this.value;
  });

  $("m2").focus();
  calcularActual();
}
  
function calcularActual(){
  if(!productoActual)return null;
  const crrl=esMaterialCorralon(productoActual);
  const oferta=Number(productoActual["OFERTA"]||0);
  const tieneOferta=Number.isFinite(oferta)&&oferta>0;
  const forma=$("forma").value||"Contado";
  const precioTarjeta=Number(productoActual["Precio Tarjeta"]||0);
  const precio=(forma==="Tarjeta"&&precioTarjeta>0)?precioTarjeta:(tieneOferta?oferta:Number(productoActual["Precio Contado"]||0));

  if(crrl){
    const cantidad=Number($("cantidad")?.value||0);
    if(cantidad<=0){$("calcInfo").textContent="";return null}
    const subtotal=cantidad*precio;
    $("calcInfo").textContent=`${cantidad} unidades · Subtotal: $ ${fmt(subtotal)}`;
    return {unidad:"Unidades",cantidad, m2Solicitados:0,conZocalo:false,porcentajeAdicional:0,m2Calculados:0,cajas:0,m2Reales:0,precioM2:precio,precioCaja:precio,subtotal,tieneOferta,oferta};
  }

  const m2=Number($("m2").value||0);if(m2<=0){$("calcInfo").textContent="";return null}
  const conZ=$("zocalo").checked, extra=conZ?10:0, m2Calc=m2*(1+extra/100);
  const caja=Number(productoActual["Caja m²"]||0);
  const cajas=Math.ceil(m2Calc/caja), reales=cajas*caja;
  const subtotal=reales*precio;
  $("calcInfo").textContent=`${conZ?"Con zócalo (+10%) · ":""}${cajas} cajas · ${fmt(reales)} m² reales · Subtotal: $ ${fmt(subtotal)}`;
  return {unidad:"m²",cantidad:m2,m2Solicitados:m2,conZocalo:conZ,porcentajeAdicional:extra,m2Calculados:m2Calc,cajas,m2Reales:reales,precioM2:precio,precioCaja:precio*caja,subtotal,tieneOferta,oferta};
}

function renderProductos(){
  if(!$("rows"))return;

  $("rows").innerHTML="";
  let total=0;

  productos.forEach((p,i)=>{
    total+=Number(p.subtotal||0);

    const esCRRL = String(p.id||"").toUpperCase().startsWith("CRRL-");

    let cantidadHTML="";

    if(esCRRL){

      cantidadHTML=`
        <strong>${fmt0(p.cantidad||0)} unidades</strong>
      `;

    }else{

      const m2Solicitados=Number(p.m2Solicitados||0);
      const m2Calculados=Number(p.m2Reales||0);
      const m2Zocalo=p.conZocalo
        ? Math.max(0,m2Calculados-m2Solicitados)
        : 0;

      cantidadHTML=`
        <strong>${fmt(m2Solicitados)} m²</strong>
        ${p.conZocalo && m2Zocalo>0
          ? `<br><small>+ ${fmt(m2Zocalo)} m² zócalo</small>`
          : ""
        }
      `;
    }

    const precioUnitario=Number(p.precioM2||0);

    const tr=document.createElement("tr");

    tr.innerHTML=`
      <td>
        <strong>${esc(p.producto)}</strong>
        ${p.color ? `<br><small>${esc(p.color)}</small>` : ""}
        ${p.tieneOferta ? ' <span class="badge">OFERTA</span>' : ""}
        ${p.conZocalo
          ? ' <span class="badge">INCLUIDO ZÓCALO</span>'
          : ""
        }
      </td>

      <td>${esc(p.medida||"—")}</td>

      <td>${cantidadHTML}</td>

      <td>${esCRRL ? "—" : p.cajas}</td>

      <td class="money">$ ${fmt(precioUnitario)}</td>

      <td class="money">$ ${fmt(p.subtotal)}</td>

      <td>
        <button class="btn btn-danger" data-remove="${i}" title="Eliminar">🗑</button>
      </td>
    `;

    $("rows").appendChild(tr);
  });

  $("total").textContent=fmt(total);
  $("empty").hidden=productos.length>0;
  $("table").hidden=productos.length===0;
}
  
$("cantidad")?.addEventListener("input",calcularActual);

$("app").addEventListener("click",e=>{
  const item=e.target.closest("[data-catalogo-index]");
  if(item){
    seleccionarProductoCatalogo(Number(item.dataset.catalogoIndex));
    return;
  }
  const btn=e.target.closest("[data-remove]");
  if(btn){
    productos.splice(Number(btn.dataset.remove),1);
    renderProductos();
    return;
  }

  if(e.target.id==="confirm"){
    const c=calcularActual();

    if(!c){
      return alert(
        esMaterialCorralon(productoActual)
          ? "Ingresá la cantidad de unidades."
          : "Ingresá los metros cuadrados."
      );
    }

    const p=productoActual;

const colorSeleccionado = $("colorSelect")?.value || p._colorSeleccionado || p["Color"] || "";

productos.push({
  id:p["ID"],
  producto:p["Producto"],
  medida:p["Medida"]||"",
  color:colorSeleccionado,
  ...c
});

    cerrarModal();
    renderProductos();
  }
});

async function guardarPresupuesto(){
  if(!productos.length)return alert("Agregá al menos un producto.");
  const cliente=$("cliente").value.trim();
  if(!cliente)return alert("Ingresá el cliente.");
  const total=productos.reduce((s,p)=>s+Number(p.subtotal||0),0);
  const datos={
    cliente,dniCuit:$("dni").value.trim(),telefono:$("telefono").value.trim(),
    email:$("email").value.trim(),direccion:$("direccion").value.trim(),
    formaPago:$("forma").value,subtotal:total,descuento:0,total,
    observaciones:"",productos
  };
  const btn=$("generate"),st=$("appStatus");
  btn.disabled=true;btn.textContent="GUARDANDO...";
  st.className="status";st.textContent="";
  try{
    const r=await jsonp({accion:"guardar",token,datos:JSON.stringify(datos)});
    if(!r?.ok)throw new Error(r?.error||"No se pudo guardar el presupuesto.");
    mostrarPresupuestoGuardado(r.numero,datos);
  }catch(e){
    st.className="status error";st.textContent=e.message;
  }finally{btn.disabled=false;btn.textContent="GENERAR PRESUPUESTO"}
}

function mostrarPresupuestoGuardado(numero,datos){
  verNumero="";
  const fecha=new Date().toLocaleDateString("es-AR");
  $("app").innerHTML=header()+`<main class="wrap">
    <div class="historical-actions no-print">
      <button class="btn btn-primary" id="printQuote">🖨 IMPRIMIR / GUARDAR PDF</button>
      <button class="btn btn-secondary" id="newQuote">NUEVO PRESUPUESTO</button>
    </div>
    ${quoteHtml(numero,fecha,datos)}
  </main>`;
  $("printQuote").onclick=()=>window.print();
  $("newQuote").onclick=nuevoPresupuesto;
}

function quoteHtml(numero,fecha,d){
  const rows=d.productos.map(p=>{
    const cr=String(p.unidad||"")==="Unidades";
    return cr
      ? `<tr><td>${esc(p.producto)}${p.tieneOferta?' <small>OFERTA</small>':''}</td><td>—</td><td>${fmt0(p.cantidad||0)} unidades</td><td>—</td><td class="money">$ ${fmt(p.precioM2)}</td><td class="money">$ ${fmt(p.subtotal)}</td></tr>`
      : `<tr><td>${esc(p.producto)}<br><small>${esc(p.color)}${p.conZocalo?' · Incl. Zócalo':''}</small></td><td>${esc(p.medida)}</td><td>${fmt(p.m2Solicitados)}</td><td>${p.cajas}</td><td class="money">$ ${fmt(p.precioM2)}</td><td class="money">$ ${fmt(p.subtotal)}</td></tr>`;
  }).join("");
  return `<section class="quote-preview" id="quote">
    <div class="quote-head"><img src="${LOGO_URL}" alt="G&T S.R.L."><div><div class="quote-number">${esc(numero)}</div><div class="quote-meta">Fecha: ${esc(fecha)}<br>Vendedor: ${esc(vendedor)}</div></div></div>
    <div class="quote-customer"><strong>Cliente:</strong> ${esc(d.cliente)}<br>
      ${d.dniCuit?`<strong>DNI/CUIT:</strong> ${esc(d.dniCuit)} · `:""}${d.telefono?`<strong>Tel.:</strong> ${esc(d.telefono)}<br>`:""}
      ${d.email?`<strong>Email:</strong> ${esc(d.email)}<br>`:""}${d.direccion?`<strong>Dirección:</strong> ${esc(d.direccion)}<br>`:""}
      <strong>Forma de pago:</strong> ${esc(d.formaPago||"Contado")}
    </div>
    <table class="quote-table"><thead><tr><th>Producto</th><th>Medida</th><th>Cantidad</th><th>Cajas</th><th>Precio</th><th>Subtotal</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="quote-total">TOTAL: $ ${fmt(d.total)}</div>
    <div class="quote-foot"><strong>Validez:</strong> 15 días. Los precios y condiciones indicados corresponden al momento de emisión del presupuesto.<br>
      G&T S.R.L. · ${esc("Conquistadores del Desierto 3400")} · Neuquén, Argentina · Tel. ${esc("299 520-7382")}
    </div>
  </section>`;
}

function renderLoadingHistorico(){
  $("app").innerHTML=header()+`<main class="wrap"><section class="card loading">Cargando presupuesto ${esc(verNumero)}...</section></main>`;
}

async function cargarHistorico(numero){
  try{
    const r=await jsonp({accion:"presupuesto",numero,token});
    if(!r?.ok)throw new Error(r?.error||"No se pudo cargar el presupuesto.");
    const p=r.presupuesto;
    const productosHistoricos=(r.productos||[]).map(x=>({
      producto:x["Producto"]||"",color:x["Color"]||"",medida:x["Medida"]||"",
      unidad:x["Unidad"]||"",cantidad:Number(x["Cantidad"]||0),
      m2Solicitados:Number(x["m² solicitados"]||x["m² Solicitados"]||x["m2 Solicitados"]||0),
      cajas:Number(x["Cajas"]||0),precioM2:Number(x["Precio/m²"]||0),subtotal:Number(x["Subtotal"]||0),
      conZocalo:String(x["Con zócalo"]||"")==="Sí",tieneOferta:Number(x["Oferta"]||0)>0
    }));
    const datos={cliente:p["Cliente"]||"",dniCuit:p["DNI/CUIT"]||"",telefono:p["Teléfono"]||"",email:p["Email"]||"",direccion:p["Dirección"]||"",formaPago:p["Forma de pago"]||"",total:Number(p["Total"]||0),productos:productosHistoricos};
    const fecha=p["Fecha"]?new Date(p["Fecha"]).toLocaleDateString("es-AR"):new Date().toLocaleDateString("es-AR");
    $("app").innerHTML=header()+`<main class="wrap"><div class="historical-actions no-print"><button class="btn btn-primary" id="printQuote">🖨 IMPRIMIR / GUARDAR PDF</button><button class="btn btn-secondary" id="newQuote">NUEVO PRESUPUESTO</button></div>${quoteHtml(numero,fecha,datos)}</main>`;
    $("printQuote").onclick=()=>window.print();$("newQuote").onclick=nuevoPresupuesto;
  }catch(e){
    $("app").innerHTML=header()+`<main class="wrap"><section class="card"><div class="status error" style="display:block">${esc(e.message)}</div><div class="actions no-print"><button class="btn btn-secondary" id="back">VOLVER</button></div></section></main>`;
    $("back").onclick=()=>{verNumero="";renderApp()};
  }
}

if(token) renderApp(); else mostrarLogin();
