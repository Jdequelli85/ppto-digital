<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#BE000F">
<title>G&T S.R.L. — Presupuesto Digital</title>
<style>
*{box-sizing:border-box}
:root{
  --rojo:#BE000F;
  --rojo2:#98000c;
  --gris:#f3f4f6;
  --gris2:#e5e7eb;
  --texto:#222;
  --muted:#6b7280;
  --verde:#176b2c;
}
html,body{margin:0;padding:0;background:var(--gris);color:var(--texto);font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer}
header{
  background:#fff;
  border-bottom:1px solid var(--gris2);
  padding:14px 18px;
  position:sticky;top:0;z-index:20;
}
.header-inner{max-width:1050px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px}
header img{width:150px;height:auto;display:block}
.user-pill{font-size:13px;color:#555;background:#f7f7f7;border:1px solid #ddd;border-radius:20px;padding:8px 12px}
.wrap{max-width:1050px;margin:24px auto;padding:0 15px 50px}
.card{
  background:#fff;border:1px solid #e2e2e2;border-radius:14px;
  padding:20px;margin-bottom:16px;box-shadow:0 3px 14px rgba(0,0,0,.05)
}
.login-card{max-width:430px;margin:70px auto}
.logo-login{width:190px;display:block;margin:0 auto 20px}
h1{font-size:24px;margin:0 0 5px}
h2{font-size:20px;margin:0}
h3{margin:0 0 14px}
.subtitle{color:var(--muted);font-size:14px;margin-bottom:24px}
label{display:block;font-weight:700;font-size:13px;margin:0 0 6px}
input,select{
  width:100%;padding:12px;border:1px solid #cfd2d7;border-radius:9px;background:#fff;outline:none
}
input:focus,select:focus{border-color:var(--rojo);box-shadow:0 0 0 3px rgba(190,0,15,.10)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.field-full{grid-column:1/-1}
.btn{
  border:0;border-radius:9px;padding:12px 16px;font-weight:800;min-height:44px
}
.btn-primary{background:var(--rojo);color:#fff}
.btn-primary:hover{background:var(--rojo2)}
.btn-secondary{background:#fff;color:#333;border:1px solid #cfd2d7}
.btn-danger{background:#fff;color:var(--rojo);border:1px solid #e5a6ab}
.btn-large{width:100%;margin-top:16px}
.status{margin-top:14px;padding:11px;border-radius:9px;font-size:14px;display:none}
.status.error{display:block;background:#fff0f1;color:#9d0010;border:1px solid #f2b7bd}
.status.ok{display:block;background:#edf8f0;color:var(--verde);border:1px solid #b9dfc2}
.titlebar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:14px}
.add-btn{white-space:nowrap}
.empty{padding:28px;text-align:center;color:#777;border:1px dashed #ccc;border-radius:10px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:10px 8px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top;font-size:13px}
th{font-size:12px;text-transform:uppercase;color:#666;background:#fafafa}
.money{text-align:right;white-space:nowrap}
.total-box{text-align:right;margin-top:15px;font-size:22px;font-weight:800}
.total-box small{display:block;font-size:12px;color:#777;font-weight:400;margin-bottom:3px}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;
  display:none;align-items:center;justify-content:center;padding:15px
}
.modal-backdrop.open{display:flex}
.modal{
  width:min(560px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:15px;padding:20px;
  box-shadow:0 15px 50px rgba(0,0,0,.3)
}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.close{border:0;background:#eee;border-radius:50%;width:34px;height:34px}
#reader{width:100%;max-width:430px;margin:15px auto}
.scan-note{font-size:13px;color:#666;text-align:center}
.product-info{background:#f7f7f7;border-radius:10px;padding:14px;margin-bottom:15px;line-height:1.55}
.calc-info{margin-top:10px;color:#555;font-size:13px;line-height:1.5}
.checkbox{display:flex;align-items:center;gap:8px;margin:13px 0;font-weight:700}
.checkbox input{width:auto}
.loading{text-align:center;padding:35px;color:#666}
.quote-preview{
  background:#fff;
  width:100%;
  max-width:none;
  margin:0 auto;
  padding:8mm;
  box-sizing:border-box;
  color:#183746;
  font-family:Arial,Helvetica,sans-serif;
}
.quote-head{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0;
  min-height:48mm;
  padding:4mm 2mm 4mm;
  border-bottom:2px solid #BE000F;
  box-sizing:border-box;
}
.quote-company{padding-right:7mm}
.quote-logo{width:62mm;max-width:100%;height:auto;display:block;margin-bottom:2mm}
.quote-company-data{font-size:3.2mm;line-height:1.5;color:#183746}
.quote-company-data strong{font-weight:800}
.quote-presentation{
  border-left:2px solid #BE000F;
  padding-left:8mm;
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  justify-content:center;
  text-align:right;
}
.quote-title{
  font-size:11mm;
  line-height:1;
  font-weight:900;
  letter-spacing:.2mm;
  color:#183746;
  white-space:nowrap;
}
.quote-number{
  margin-top:3mm;
  font-size:6.2mm;
  line-height:1.1;
  font-weight:900;
  color:#BE000F;
  white-space:nowrap;
}
.quote-meta{
  margin-top:4mm;
  color:#183746;
  font-size:3.4mm;
  line-height:1.65;
  text-align:right;
}
.quote-meta strong{font-weight:800}
.quote-section{margin-top:3mm}
.quote-section-line{height:2px;background:#BE000F;margin-bottom:3mm}
.quote-section-title{
  display:flex;
  align-items:center;
  gap:3mm;
  margin-bottom:2.5mm;
  font-size:4mm;
  font-weight:900;
  text-transform:uppercase;
  color:#183746;
}
.quote-section-title::before{
  content:"";
  width:4mm;
  height:4mm;
  border-radius:1mm;
  background:#C58A22;
  flex:0 0 auto;
}
.quote-customer{
  margin:0;
  padding:3mm 2mm;
  background:#fff;
  border:0;
  border-radius:0;
  font-size:3.4mm;
  line-height:1.8;
  color:#263f4b;
}
.quote-customer-grid{
  display:grid;
  grid-template-columns:1.6fr 1fr;
  column-gap:8mm;
  row-gap:1mm;
}
.quote-field{min-width:0}
.quote-field strong{color:#183746;font-weight:800}
.quote-field-value{color:#333}
.quote-payment{
  margin-top:2mm;
  padding:3mm 2mm;
  display:flex;
  align-items:center;
  gap:5mm;
  border-top:1px solid #d9dee1;
  border-bottom:1px solid #d9dee1;
  font-size:3.3mm;
}
.quote-payment-title{font-weight:900;color:#183746;margin-right:2mm}
.quote-payment-option{display:inline-flex;align-items:center;gap:2mm;color:#344954}
.quote-check{width:4mm;height:4mm;border:1.3px solid #183746;border-radius:.8mm;display:inline-block;box-sizing:border-box}
.quote-payment-selected{display:none}
.quote-detail{margin-top:3mm}
.quote-table{width:100%;min-width:0;border-collapse:collapse;table-layout:fixed}
.quote-table th{background:#183746;color:#fff;padding:3mm 2mm;border:1px solid #183746;font-size:3.1mm;font-weight:800;text-transform:uppercase}
.quote-table td{padding:2.5mm 2mm;border:1px solid #d7dde0;font-size:3.1mm;color:#263f4b;vertical-align:middle}
.quote-table tbody tr:nth-child(even){background:#f4f6f7}
.quote-table th:nth-child(1),.quote-table td:nth-child(1){width:31%}
.quote-table th:nth-child(2),.quote-table td:nth-child(2){width:12%}
.quote-table th:nth-child(3),.quote-table td:nth-child(3){width:11%;text-align:center}
.quote-table th:nth-child(4),.quote-table td:nth-child(4){width:10%;text-align:center}
.quote-table th:nth-child(5),.quote-table td:nth-child(5){width:16%;text-align:right}
.quote-table th:nth-child(6),.quote-table td:nth-child(6){width:20%;text-align:right}
.quote-table small{color:#6b7280;font-size:2.8mm}
.quote-unidades-caja{display:block;color:#777;font-size:2.7mm;line-height:1.25;margin-top:1mm}
.money{text-align:right;white-space:nowrap}
.quote-total{display:flex;justify-content:flex-end;align-items:center;gap:5mm;margin-top:4mm;font-size:5mm;font-weight:900;color:#183746}
.quote-total-value{min-width:45mm;padding:3mm 4mm;text-align:right;border:2px solid #183746;border-radius:2mm;background:#f2f5f6;color:#BE000F}
.quote-footer-line{height:2px;background:#BE000F;margin-top:5mm;margin-bottom:3mm}
.quote-foot{margin:0;padding:0;border:0;font-size:3mm;line-height:1.5;color:#59666c;display:grid;grid-template-columns:1fr 1.5fr;gap:8mm;align-items:center}
.quote-thanks{font-size:4mm;font-weight:800;color:#183746}
.quote-thanks span{color:#C58A22}
.quote-legal{text-align:right}
.quote-legal strong{color:#183746}
.historical-actions{display:flex;gap:10px;margin-bottom:15px}
.badge{display:inline-block;font-size:11px;padding:4px 7px;border-radius:10px;background:#eee;color:#555}.badge-zocalo{background:#e5e7eb;color:#555}
.modal-productos{width:min(760px,100%)}
.catalogo-lista{margin-top:12px;display:flex;flex-direction:column;gap:7px;max-height:52vh;overflow:auto;padding-right:3px}
.catalogo-item{width:100%;text-align:left;background:#fff;border:1px solid #d9dce1;border-radius:10px;padding:11px 13px;display:flex;flex-direction:column;gap:3px;transition:.15s}
.catalogo-item:hover{border-color:var(--rojo);background:#fff7f7}
.catalogo-item strong{font-size:14px}
.catalogo-item span{font-size:12px;color:#666}
.loading-catalogo{margin-top:70px;text-align:center}
.catalog-spinner{width:32px;height:32px;margin:20px auto;border:4px solid #e5e7eb;border-top-color:var(--rojo);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(min-width:1000px){
  .wrap{max-width:1180px}
  .header-inner{max-width:1180px}
  .grid{grid-template-columns:repeat(3,1fr)}
  .modal-productos{width:min(820px,100%)}
  .catalogo-lista{max-height:58vh}
}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){
  header{position:relative}
  .header-inner{align-items:flex-start}
  header img{width:125px}
  .user-pill{font-size:11px}
  .wrap{margin:12px auto}
  .card{padding:15px;border-radius:11px}
  .grid{grid-template-columns:1fr}
  .titlebar{align-items:stretch;flex-direction:column}
  .add-btn{width:100%}
  .actions{flex-direction:column}
  .actions button{width:100%}
  .quote-head{grid-template-columns:1fr;gap:5mm}
  .quote-presentation{border-left:0;border-top:2px solid #BE000F;padding:4mm 0 0;align-items:flex-start;text-align:left}
  .quote-meta{text-align:left}
  .quote-customer-grid{grid-template-columns:1fr}
  .quote-payment{flex-wrap:wrap}
  .quote-payment-selected{margin-left:0;width:100%}
  .quote-foot{grid-template-columns:1fr}
  .quote-legal{text-align:left}
}
@media print{
  @page{size:A4;margin:0}
  html,body{width:210mm;min-height:297mm;margin:0;padding:0;background:#fff}
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  header,.no-print{display:none!important}
  .wrap{width:210mm;max-width:none;margin:0;padding:0}
  .card{border:0;box-shadow:none;padding:0;margin:0}
  .quote-preview{width:210mm;min-height:297mm;margin:0;padding:8mm;box-sizing:border-box;border:0}
  .quote-head,.quote-customer,.quote-payment,.quote-detail,.quote-total,.quote-foot{page-break-inside:avoid}
  .quote-table{page-break-inside:auto}
  .quote-table tr{page-break-inside:avoid;page-break-after:auto}
}
</style>
</head>
<body>

<div id="app"></div>

<script src="app-NUEVO.js"></script>
</body>
</html>
